# Publica o app web (pasta web/) no GitHub Pages a cada push na main que mexa no web/.
# Para ligar: GitHub → Settings → Pages → Source: "GitHub Actions".
name: Web (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['web/**', 'ml/config/**', 'Assets/StreamingAssets/Catalog/**', '.github/workflows/web-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 ../tools/sync_web_data.py --check
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
